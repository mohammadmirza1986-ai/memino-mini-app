<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <title>میمینو</title>

  <link rel="stylesheet" href="style.css">

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <div class="app">

    <header class="topbar">
      <div class="profile">
        <div class="avatar">👤</div>

        <div>
          <div id="name">بازیکن میمینو</div>
          <small>سطح <b id="level">1</b></small>
        </div>
      </div>

      <button class="settings" id="settings">⚙️</button>
    </header>

    <section class="wallet">
      <div>
        💎 <b id="gems">250</b>
        <span> جم</span>
      </div>

      <div>
        😂 <b id="laugh">500</b>
        <span> خنده</span>
      </div>
    </section>

    <section class="hero">
      <div class="mascot">🎮</div>

      <h1>میمینو</h1>

      <p>آماده‌ای یه بازی بامزه شروع کنیم؟</p>

      <button class="play" id="play">
        🎮 شروع بازی
      </button>
    </section>

    <section class="grid">
      <button>
        👥
        <span>دوستان</span>
      </button>

      <button>
        🏆
        <span>رتبه‌بندی</span>
      </button>

      <button>
        🎁
        <span>مأموریت‌ها</span>
      </button>

      <button>
        🐾
        <span>پت من</span>
      </button>
    </section>

    <nav class="bottom">
      <button class="active">
        🏠
        <small>خانه</small>
      </button>

      <button>
        🃏
        <small>کارت‌ها</small>
      </button>

      <button>
        👥
        <small>دوستان</small>
      </button>

      <button>
        👤
        <small>پروفایل</small>
      </button>
    </nav>

  </div>

  <script src="app.js"></script>

</body>
  </html>
